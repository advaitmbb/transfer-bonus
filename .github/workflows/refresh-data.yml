name: Refresh transfer bonus data

on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours (UTC)
  workflow_dispatch:           # adds a manual "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest data from the sheet
        run: |
          curl -sSL --fail --retry 3 --retry-delay 5 \
            "https://script.google.com/macros/s/AKfycby5q9p_Ik2MA8ePJCH0PjdDeRaCqmO2eSpRRGM6SV3Xf6n4WgI5_gUp3ioNqy6dEbF4/exec" \
            -o data.new.json
          jq -e 'type == "array" and length > 0' data.new.json > /dev/null
          mv data.new.json data.json

      - name: Commit if the data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No change — nothing to commit."
          else
            git commit -m "Auto-refresh transfer bonus data [skip ci]"
            git push
          fi
