<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfer Bonuses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    overflow-x: hidden;
    background: #faf6ee;
    font-family: 'Inter', sans-serif;
  }

  body { padding: 28px 0 48px; }

  .inner { padding: 0 14px; }

  /* Header */
  .header { text-align: center; margin-bottom: 24px; }
  .title { font-family: 'Fraunces', serif; font-size: 1.5rem; font-weight: 700; color: #1a2b3c; line-height: 1.2; margin-bottom: 6px; }
  .subtitle { font-size: .82rem; color: #6b7e8f; margin-bottom: 4px; }
  .updated { font-size: .7rem; color: #a0b0be; }

  /* Filters */
  .filters-wrap { width: 100%; overflow: hidden; margin-bottom: 18px; }
  .filters { display: flex; gap: 7px; overflow-x: auto; padding: 0 14px 8px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filter-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 13px; border-radius: 100px; border: 2px solid #1a2b3c; background: transparent; color: #1a2b3c; font-family: 'Inter', sans-serif; font-size: .75rem; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all .18s ease; }
  .filter-btn:hover, .filter-btn.active { background: #1a2b3c; color: #faf6ee; }
  .count { display: inline-flex; align-items: center; justify-content: center; background: #38b6ff; color: #fff; font-size: .62rem; font-weight: 700; width: 15px; height: 15px; border-radius: 100px; }
  .filter-btn.active .count { background: rgba(255,255,255,.25); }

  /* List */
  .list { display: flex; flex-direction: column; gap: 9px; margin-bottom: 32px; }

  /* Card */
  .card { background: #fff; border-radius: 14px; border-top: 3px solid #38b6ff; padding: 13px 14px; box-shadow: 0 2px 10px rgba(26,43,60,.06); }
  .card-top { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; flex-wrap: wrap; }
  .prog { background: #1a2b3c; color: #fff; font-size: .58rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 100px; white-space: nowrap; }
  .expiring { background: #fff3cd; color: #c07000; font-size: .58rem; font-weight: 700; padding: 3px 8px; border-radius: 100px; white-space: nowrap; }
  .card-mid { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .bonus { font-family: 'Fraunces', serif; font-size: 2rem; font-weight: 700; color: #38b6ff; line-height: 1; }
  .bonus-lbl { font-size: .6rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #a0b0be; }
  .partner { font-family: 'Fraunces', serif; font-size: .95rem; font-weight: 600; color: #1a2b3c; line-height: 1.3; margin-bottom: 7px; word-wrap: break-word; }
  .divider { height: 1px; background: #f0ece3; margin-bottom: 7px; }
  .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .meta-item { font-size: .71rem; color: #8a9aaa; }
  .meta-item strong { color: #1a2b3c; font-weight: 600; }
  .rating { font-size: .68rem; font-weight: 700; padding: 2px 7px; border-radius: 100px; }
  .rating.pos { background: #e6f9f0; color: #1a7a4a; }
  .rating.neg { background: #fdecea; color: #c0392b; }

  /* State */
  .state { text-align: center; padding: 36px 16px; color: #a0b0be; font-size: .88rem; }

  /* Expired */
  .exp-label { font-family: 'Fraunces', serif; font-size: 1rem; font-weight: 600; color: #a0b0be; text-align: center; margin-bottom: 14px; }
  .exp-list { display: flex; flex-direction: column; opacity: .65; border: 1px solid #ece8e0; border-radius: 12px; overflow: hidden; }
  .exp-row { display: flex; align-items: center; padding: 9px 12px; background: #fff; border-bottom: 1px solid #f0ece3; gap: 10px; }
  .exp-row:last-child { border-bottom: none; }
  .exp-bonus { font-family: 'Fraunces', serif; font-size: 1.1rem; font-weight: 700; color: #ccc; flex-shrink: 0; width: 44px; text-align: center; }
  .exp-info { flex: 1; min-width: 0; overflow: hidden; }
  .exp-prog { background: #e2ddd4; color: #8a9aaa; font-size: .57rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 100px; display: inline-block; margin-bottom: 2px; }
  .exp-partner { font-size: .8rem; font-weight: 600; color: #9aabbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .exp-date { font-size: .67rem; color: #bbb; }
</style>
</head>
<body>

<div class="inner">
  <div class="header">
    <h2 class="title">Active Transfer Bonuses</h2>
    <p class="subtitle">All current transfer bonus offers</p>
    <p class="updated" id="updated"></p>
  </div>
</div>

<div class="filters-wrap">
  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">All</button>
  </div>
</div>

<div class="inner">
  <div class="list" id="list"><div class="state">Loading bonuses…</div></div>
  <div id="expired-wrap" style="display:none">
    <p class="exp-label">Expired Bonuses</p>
    <div class="exp-list" id="exp-list"></div>
  </div>
</div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycby5q9p_Ik2MA8ePJCH0PjdDeRaCqmO2eSpRRGM6SV3Xf6n4WgI5_gUp3ioNqy6dEbF4/exec';

function norm(p) {
  p = (p || '').toLowerCase();
  if (p.includes('amex') || p.includes('american express') || p.includes('membership')) return 'Amex';
  if (p.includes('bilt')) return 'Bilt';
  if (p.includes('capital one')) return 'Capital One';
  if (p.includes('chase') || p.includes('ultimate')) return 'Chase';
  if (p.includes('citi') || p.includes('thankyou')) return 'Citi';
  return p;
}

function parseDate(s) {
  if (!s) return null;
  s = String(s).trim();
  var pts = s.split('/');
  if (pts.length === 3) {
    var y = parseInt(pts[2], 10);
    if (y < 100) y += 2000;
    return new Date(y, parseInt(pts[0], 10) - 1, parseInt(pts[1], 10));
  }
  var d = new Date(s); return isNaN(d) ? null : d;
}

function today() { var d = new Date(); d.setHours(0,0,0,0); return d; }
function daysUntil(s) { var d = parseDate(s); if (!d) return Infinity; return Math.ceil((d - today()) / 86400000); }
function fmtDate(s) { var d = parseDate(s); if (!d) return s; return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }

function fmtBonus(val) {
  if (!val || val === '—') return '—';
  var s = String(val).trim();
  if (s.indexOf('%') !== -1) return s;
  var n = parseFloat(s);
  if (isNaN(n)) return s;
  if (n > 0 && n < 1) return Math.round(n * 100) + '%';
  return Math.round(n) + '%';
}

function fmtRating(val) {
  var n = parseInt(val, 10);
  if (!n || n === 0) return '';
  var icon = n > 0 ? '👍' : '👎';
  var cls  = n > 0 ? 'pos' : 'neg';
  var icons = '';
  for (var i = 0; i < Math.abs(n); i++) icons += icon;
  return '<span class="rating ' + cls + '">' + icons + '</span>';
}

function card(row) {
  var program = norm(row['Program']);
  var partner = row['Partner'] || '—';
  var bonus   = fmtBonus(row['Bonus']);
  var end     = row['End Date'] || '';
  var ratio   = row['Bonus Ratio'] || row['Transfer Ratio'] || '—';
  var rating  = fmtRating(row['Rating']);
  var days    = daysUntil(end);
  var expiring = days >= 0 && days <= 7;
  var expiryStr = days === 0 ? 'Today' : days === 1 ? 'Tomorrow' : expiring ? 'In ' + days + ' days' : fmtDate(end);

  return '<div class="card">'
    + '<div class="card-top"><span class="prog">' + program + '</span>' + (expiring ? '<span class="expiring">⚡ Ends Soon</span>' : '') + '</div>'
    + '<div class="card-mid"><span class="bonus">' + bonus + '</span><span class="bonus-lbl">Transfer Bonus</span></div>'
    + '<div class="partner">' + partner + '</div>'
    + '<div class="divider"></div>'
    + '<div class="meta">'
    +   '<span class="meta-item">Exp <strong>' + expiryStr + '</strong></span>'
    +   '<span class="meta-item">Ratio <strong>' + ratio + '</strong></span>'
    +   (rating ? rating : '')
    + '</div>'
    + '</div>';
}

function render(data, filter) {
  var active  = data.filter(function(r){ return daysUntil(r['End Date']) >= 0; });
  var expired = data.filter(function(r){ return daysUntil(r['End Date']) < 0; });
  var shown   = filter === 'all' ? active : active.filter(function(r){ return norm(r['Program']) === filter; });

  document.getElementById('list').innerHTML = shown.length
    ? shown.map(function(r){ return card(r); }).join('')
    : '<div class="state">No active bonuses for this program.</div>';

  var wrap = document.getElementById('expired-wrap');
  if (expired.length) {
    wrap.style.display = 'block';
    document.getElementById('exp-list').innerHTML = expired.map(function(r) {
      return '<div class="exp-row">'
        + '<div class="exp-bonus">' + fmtBonus(r['Bonus']) + '</div>'
        + '<div class="exp-info">'
        +   '<span class="exp-prog">' + norm(r['Program']) + '</span>'
        +   '<span class="exp-partner">' + (r['Partner'] || '—') + '</span>'
        +   '<span class="exp-date">Expired ' + fmtDate(r['End Date']) + '</span>'
        + '</div>'
        + '</div>';
    }).join('');
  } else {
    wrap.style.display = 'none';
  }

  /* Tell parent iframe to resize */
  window.parent.postMessage({ mbbHeight: document.body.scrollHeight }, '*');
}

function buildFilters(data) {
  var active   = data.filter(function(r){ return daysUntil(r['End Date']) >= 0; });
  var programs = [];
  active.forEach(function(r){ var p = norm(r['Program']); if (programs.indexOf(p) === -1) programs.push(p); });
  programs.sort();

  var el = document.getElementById('filters');
  el.innerHTML = '<button class="filter-btn active" data-filter="all">All <span class="count">' + active.length + '</span></button>';
  programs.forEach(function(p) {
    var n = active.filter(function(r){ return norm(r['Program']) === p; }).length;
    el.innerHTML += '<button class="filter-btn" data-filter="' + p + '">' + p + ' <span class="count">' + n + '</span></button>';
  });
  el.querySelectorAll('.filter-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      el.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      render(data, btn.getAttribute('data-filter'));
    });
  });
}

fetch(API_URL)
  .then(function(r){ return r.json(); })
  .then(function(data) {
    buildFilters(data);
    render(data, 'all');
    document.getElementById('updated').textContent =
      'Last updated: ' + new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    setTimeout(function(){ window.parent.postMessage({ mbbHeight: document.body.scrollHeight }, '*'); }, 300);
  })
  .catch(function() {
    document.getElementById('list').innerHTML = '<div class="state">Unable to load bonuses — please check back shortly.</div>';
  });
</script>
</body>
</html>
